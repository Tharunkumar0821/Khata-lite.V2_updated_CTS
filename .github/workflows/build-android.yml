name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # fail fast instead of hanging for 6 hours
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm            # caches the npm download cache

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: khata-lite-apk
          path: android/app/build/outputs/apk/release/app-release.apk
